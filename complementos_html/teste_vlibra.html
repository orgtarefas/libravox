<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>LibraVox Aula</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="../style_principal.css">

</head>

<body>

<div class="container-fluid p-4">

    <div class="row g-4">

        <div class="col-lg-8">

            <div class="card shadow p-4">

                <h2 class="mb-4">
                    LibraVox - Aula em Libras
                </h2>

                <div class="d-flex gap-3 flex-wrap">

                    <button class="btn btn-success botao-controle"
                            id="btnIniciar">

                        🎤 Iniciar Aula

                    </button>

                    <button class="btn btn-danger botao-controle"
                            onclick="finalizarAula()">

                        ⛔ Finalizar Aula

                    </button>

                    <button class="btn btn-warning botao-controle"
                            onclick="limparAula()">
                    
                        🧹 Limpar Aula
                    
                    </button>

                </div>

                <hr>

                <h5>Status</h5>

                <div id="status"
                     class="status-box">

                    Aguardando início...

                </div>

                <hr>

                <h5>Texto Reconhecido</h5>

                <div id="textoReconhecido"
                     class="texto-box"></div>

                <hr>

                <h5>Imagens da Aula</h5>

                <div id="galeria"
                     class="row"></div>

            </div>

        </div>

        <div class="col-lg-4">

            <div class="card shadow p-4">

                <h4 class="mb-3">
                    Tradução VLibras
                </h4>

                <div id="textoVlibras"
                     class="texto-vlibras"></div>

            </div>

        </div>

    </div>

</div>

<input type="file"
       id="cameraInput"
       accept="image/*"
       capture="environment"
       hidden>

<div vw class="enabled">

    <div vw-access-button class="active"></div>

    <div vw-plugin-wrapper>

        <div class="vw-plugin-top-wrapper"></div>

    </div>

</div>

<script src="../script_principal.js"></script>

<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>

<script src="../complementos_js/vlibras.js"></script>

</body>
</html>
