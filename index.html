<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>LibraVox - Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="style_principal.css">

</head>

<body class="bg-dark">

<div class="container vh-100 d-flex justify-content-center align-items-center">

    <div class="card shadow p-4 login-card">

        <div class="text-center">

            <img src="imagens/logo.png"
                 class="logo mb-3">

            <h2>LibraVox</h2>

        </div>

        <input type="text"
               id="login"
               class="form-control mt-3"
               placeholder="Login">

        <input type="password"
               id="senha"
               class="form-control mt-3"
               placeholder="Senha">

        <button class="btn btn-primary mt-4 w-100"
                onclick="entrar()">

            Entrar

        </button>

        <div id="erro"
             class="text-danger mt-3 text-center"></div>

    </div>

</div>

<script>

function entrar(){

    const login = document.getElementById("login").value;
    const senha = document.getElementById("senha").value;

    if(login === "123" && senha === "123"){

        localStorage.setItem("logado", "sim");

        window.location.href = "complementos.html/teste_vlibra.html";

    }else{

        document.getElementById("erro").innerHTML = "Login inválido.";

    }

}

</script>

</body>
</html>
